services:
  db:
    image: postgres:16-alpine
    container_name: news_cards_db
    environment:
      POSTGRES_USER: newsuser
      POSTGRES_PASSWORD: newspass
      POSTGRES_DB: newsdb
    volumes:
      - pgdata:/var/lib/postgresql/data      # durable — survives restarts & redeploys
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsuser -d newsdb"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  news-cards-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_cards_backend
    ports:
      - "8000:8000"
    environment:
      # host is the compose service name "db", not localhost
      DATABASE_URL: postgresql://newsuser:newspass@db:5432/newsdb
      NEWS_API_KEY: ${NEWS_API_KEY:-your_news_api_key_here}
      REFRESH_INTERVAL: ${REFRESH_INTERVAL:-12}       # hours between auto-refreshes
      PURGE_OLDER_THAN_DAYS: ${PURGE_OLDER_THAN_DAYS:-7}  # delete articles older than this
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
