services:
  db:
    image: postgres:16-alpine
    container_name: news_cards_db
    environment:
      # Credentials come from backend/.env (gitignored). The :? form fails the
      # container start with a clear message rather than silently booting on a
      # weak default that is public in this repo's history.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-newsdb}
    volumes:
      - pgdata:/var/lib/postgresql/data      # durable — survives restarts & redeploys
    healthcheck:
      # $$ escapes compose substitution so the shell expands these inside the container
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  news-cards-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_cards_backend
    ports:
      - "8000:8000"
    environment:
      # host is the compose service name "db", not localhost
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-newsdb}
      NEWS_API_KEY: ${NEWS_API_KEY:?set NEWS_API_KEY in backend/.env}
      # Guards refresh + telemetry. The :? form fails the container start with a
      # clear message rather than booting with those endpoints returning 503.
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in backend/.env (openssl rand -hex 32)}
      REFRESH_INTERVAL: ${REFRESH_INTERVAL:-12}       # hours between auto-refreshes
      PURGE_OLDER_THAN_DAYS: ${PURGE_OLDER_THAN_DAYS:-7}  # delete articles older than this
      # Retention for request_logs. Defaults to the article window so the two
      # halves of the analytics union cover the same period -- see
      # database.purge_old_request_logs before changing it.
      REQUEST_LOG_RETENTION_DAYS: ${REQUEST_LOG_RETENTION_DAYS:-${PURGE_OLDER_THAN_DAYS:-7}}
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-${PURGE_OLDER_THAN_DAYS:-7}}
      SESSION_METRIC_WINDOW_DAYS: ${SESSION_METRIC_WINDOW_DAYS:-${SESSION_RETENTION_DAYS:-${PURGE_OLDER_THAN_DAYS:-7}}}
      LOG_FLUSH_INTERVAL: ${LOG_FLUSH_INTERVAL:-10}   # seconds between request-log flushes
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Nightly enrichment (ADR-011). One-shot, not a server -- it exits when done.
  #
  #   docker compose run --rm enrichment python enrichment.py --dry-run
  #   docker compose run --rm enrichment python enrichment.py --limit 5
  #
  # Behind a profile so `docker compose up` never starts it. It reuses the
  # backend image rather than defining its own, so no second build.
  #
  # A separate service rather than `exec` into the running API, purely for
  # mem_limit. On a 956 MB box the failure mode that matters is the OOM killer
  # picking Postgres, because Postgres has the largest RSS. Capping this
  # container means a runaway enrichment run kills itself instead. 400m covers
  # the ~250 MB the ONNX session, tokenizer and lxml actually need, and leaves
  # headroom above Postgres (~250) and the API (~130).
  enrichment:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-newsdb}
      EMBED_MODEL_PATH: ${EMBED_MODEL_PATH:-models/minilm-int8.onnx}
      EMBED_TOKENIZER_PATH: ${EMBED_TOKENIZER_PATH:-models/tokenizer.json}
      BULLET_COUNT: ${BULLET_COUNT:-3}
      # The job reads MemAvailable from /proc/meminfo, which inside a container
      # reports the HOST's memory, not this container's limit. That is what we
      # want -- the question is whether the box has room, not whether the cgroup
      # does. Refuses to load the session below this.
      ENRICH_MIN_AVAILABLE_MB: ${ENRICH_MIN_AVAILABLE_MB:-250}
    volumes:
      # Read-only bind mount, not a named volume: these are two files you
      # downloaded by hand and may need to swap if the export turns out to be
      # wrong for this CPU. A named volume would hide them.
      - ./models:/app/models:ro
    mem_limit: 400m
    depends_on:
      db:
        condition: service_healthy
    restart: "no"        # one-shot; restarting a finished batch would re-run it

volumes:
  pgdata:
