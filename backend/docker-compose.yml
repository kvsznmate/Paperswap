services:
  db:
    image: postgres:16-alpine
    container_name: news_cards_db
    environment:
      # Credentials come from backend/.env (gitignored). The :? form fails the
      # container start with a clear message rather than silently booting on a
      # weak default that is public in this repo's history.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-newsdb}
    volumes:
      - pgdata:/var/lib/postgresql/data      # durable — survives restarts & redeploys
    healthcheck:
      # $$ escapes compose substitution so the shell expands these inside the container
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  news-cards-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_cards_backend
    ports:
      - "8000:8000"
    environment:
      # host is the compose service name "db", not localhost
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-newsdb}
      NEWS_API_KEY: ${NEWS_API_KEY:?set NEWS_API_KEY in backend/.env}
      # Guards refresh + telemetry. The :? form fails the container start with a
      # clear message rather than booting with those endpoints returning 503.
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in backend/.env (openssl rand -hex 32)}
      REFRESH_INTERVAL: ${REFRESH_INTERVAL:-12}       # hours between auto-refreshes
      # Delete articles older than this. Default is 9, not 7, because the weekly
      # summariser reads the last completed Mon-Sun week and a 7-day window has
      # already started deleting it by the time the Monday job runs. main.py
      # clamps anything lower back up to 9. See ADR-011.
      PURGE_OLDER_THAN_DAYS: ${PURGE_OLDER_THAN_DAYS:-9}
      # Retention for request_logs. Defaults to the article window so the two
      # halves of the analytics union cover the same period -- see
      # database.purge_old_request_logs before changing it.
      REQUEST_LOG_RETENTION_DAYS: ${REQUEST_LOG_RETENTION_DAYS:-${PURGE_OLDER_THAN_DAYS:-9}}
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-${PURGE_OLDER_THAN_DAYS:-9}}
      SESSION_METRIC_WINDOW_DAYS: ${SESSION_METRIC_WINDOW_DAYS:-${SESSION_RETENTION_DAYS:-${PURGE_OLDER_THAN_DAYS:-9}}}
      LOG_FLUSH_INTERVAL: ${LOG_FLUSH_INTERVAL:-10}   # seconds between request-log flushes
      # --- Weekly topic summaries ---
      # Unset ANTHROPIC_API_KEY is fine: the default generator is offline.
      SUMMARY_GENERATOR: ${SUMMARY_GENERATOR:-extractive:v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-}
      SUMMARY_TIMEOUT: ${SUMMARY_TIMEOUT:-60}
      SUMMARY_PUBLISHER_DESCRIPTIONS_ONLY: ${SUMMARY_PUBLISHER_DESCRIPTIONS_ONLY:-true}
      MIN_ARTICLES_FOR_SUMMARY: ${MIN_ARTICLES_FOR_SUMMARY:-3}
      SUMMARY_MAX_ARTICLES: ${SUMMARY_MAX_ARTICLES:-80}
      # 0 = keep forever. These rows outlive the articles they describe.
      SUMMARY_RETENTION_WEEKS: ${SUMMARY_RETENTION_WEEKS:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
