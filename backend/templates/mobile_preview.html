<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PaperSwap - MVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090c15;
            --card-bg: #121824;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #6366f1;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.15), transparent 60%);
        }

        .app-shell {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #0d121d;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        @media (min-width: 480px) {
            .app-shell {
                height: 92vh;
                border-radius: 40px;
                border: 4px solid #1e2638;
            }
        }

        .app-header {
            padding: 18px 24px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .queue-counter {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            background: rgba(30, 41, 59, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .deck-container {
            flex: 1;
            position: relative;
            margin: 10px 16px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .swipe-card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 28px;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            cursor: grab;
            touch-action: none;
            will-change: transform;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
        }

        .swipe-card:active { cursor: grabbing; }

        /* ---- Card rendered from article fields (no server PNG) ---- */
        .card-media {
            position: relative;
            flex: 0 0 56%;
            background: linear-gradient(150deg, #1b2333, #2a3450);
            overflow: hidden;
        }
        .card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            display: block;
        }
        .card-media::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(9,12,21,0) 45%, rgba(9,12,21,0.55) 100%);
        }
        .cat-chip {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 2;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 6px 12px;
            border-radius: 999px;
            color: #0b0f18;
        }
        /* Chip colour comes from the API (accent_color per topic) so the palette
           lives in one place on the backend instead of drifting per client. */

        /* ---- Topic filter bar ---- */
        .topic-bar {
            display: flex;
            gap: 8px;
            padding: 4px 16px 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            flex: 0 0 auto;
            z-index: 20;
        }
        .topic-bar::-webkit-scrollbar { display: none; }

        .topic-pill {
            flex: 0 0 auto;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
            padding: 7px 14px;
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-sub);
            background: rgba(30, 41, 59, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.18s ease;
        }
        .topic-pill:active { transform: scale(0.94); }
        .topic-pill.active {
            color: #0b0f18;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }
        .topic-pill .pill-count {
            opacity: 0.65;
            font-weight: 600;
            margin-left: 4px;
        }

        .card-content {
            flex: 1;
            padding: 20px 22px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(180deg, #141b29 0%, var(--card-bg) 60%);
        }
        .card-title {
            font-size: 22px;
            line-height: 1.22;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-desc {
            font-size: 14.5px;
            line-height: 1.5;
            color: var(--text-sub);
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-meta {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #6b7688;
            border-top: 1px solid rgba(255,255,255,0.07);
            padding-top: 12px;
        }
        .card-meta .src {
            font-weight: 700;
            color: #aeb7c7;
            max-width: 55%;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .swipe-badge {
            position: absolute;
            top: 40px;
            font-size: 28px;
            font-weight: 800;
            padding: 8px 24px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 30;
            pointer-events: none;
        }
        .badge-read {
            right: 30px;
            color: var(--accent-green);
            border: 4px solid var(--accent-green);
            transform: rotate(15deg);
        }
        .badge-pass {
            left: 30px;
            color: var(--accent-red);
            border: 4px solid var(--accent-red);
            transform: rotate(-15deg);
        }

        .app-actions {
            padding: 10px 30px 25px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
        }
        .action-btn {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(22, 30, 46, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .action-btn:active { transform: scale(0.88); }
        .btn-pass { color: var(--accent-red); border-color: rgba(239, 68, 68, 0.3); }
        .btn-pass:hover { background: rgba(239, 68, 68, 0.15); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
        .btn-read {
            width: 72px;
            height: 72px;
            font-size: 30px;
            color: var(--accent-green);
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(16, 185, 129, 0.15);
        }
        .btn-read:hover { background: rgba(16, 185, 129, 0.3); box-shadow: 0 0 25px rgba(16, 185, 129, 0.5); }
        .btn-undo { color: var(--accent-amber); border-color: rgba(245, 158, 11, 0.3); font-size: 22px; }

        .empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            height: 100%;
        }
        .empty-state h3 { font-size: 22px; margin: 15px 0 10px; }
        .empty-state p { font-size: 14px; color: var(--text-sub); margin-bottom: 25px; }
        .btn-reload {
            background: linear-gradient(135deg, var(--accent-blue), #4f46e5);
            color: #fff;
            padding: 12px 28px;
            border-radius: 14px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <header class="app-header">
            <div class="brand-logo">
                <svg width="24" height="24" viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="108" height="108" rx="28" fill="url(#mob-logo-grad)"/>
                    <path d="M54 20L24 65h24l-6 23 36-45h-24z" fill="#FFFFFF"/>
                    <defs>
                        <linearGradient id="mob-logo-grad" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#818CF8"/>
                            <stop offset="1" stop-color="#6366F1"/>
                        </linearGradient>
                    </defs>
                </svg> PaperSwap
            </div>
            <div class="queue-counter" id="queue-counter">Card 1 / 50</div>
        </header>

        <div class="topic-bar" id="topic-bar"></div>

        <div class="deck-container" id="deck-container">
            <div class="empty-state" id="empty-state">
                <h3>All caught up!</h3>
                <p id="empty-message">You've swiped every headline in this mix. Pull a fresh batch or switch topics to keep going.</p>
                <button class="btn-reload" onclick="reloadFeed()">Reload Feed</button>
            </div>
        </div>

        <footer class="app-actions">
            <button class="action-btn btn-undo" title="Undo last swipe" onclick="undoSwipe()">↩</button>
            <button class="action-btn btn-pass" title="Pass / Skip" onclick="triggerSwipe('left')">✖</button>
            <button class="action-btn btn-read" title="Read Article" onclick="triggerSwipe('right')">💚</button>
        </footer>
    </div>

    <script>
        let articlesQueue = [];
        let currentIndex = 0;
        let historyStack = [];
        let activeCardEl = null;
        // Guards completeSwipe against re-entry, so one gesture can never advance
        // the deck twice or open two tabs.
        let isSwiping = false;

        // Topic filtering state. Empty selectedTopics = show every topic.
        let availableTopics = [];
        let selectedTopics = [];

        let startX = 0, startY = 0;
        let currentX = 0, currentY = 0;
        let isDragging = false;

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str == null ? '' : str;
            return d.innerHTML;
        }

        // Pick readable text for a topic accent colour (BT.601 perceived luminance),
        // so amber and indigo chips are both legible without a hand-tuned map.
        function contrastText(hex) {
            const h = String(hex || '').replace('#', '');
            if (h.length !== 6) return '#0b0f18';
            const r = parseInt(h.slice(0, 2), 16);
            const g = parseInt(h.slice(2, 4), 16);
            const b = parseInt(h.slice(4, 6), 16);
            return ((r * 299 + g * 587 + b * 114) / 1000) > 150 ? '#0b0f18' : '#ffffff';
        }

        async function loadTopics() {
            try {
                const response = await fetch('/api/v1/categories');
                const data = await response.json();
                availableTopics = data.categories || [];
                renderTopicBar();
            } catch (err) {
                console.error("Failed to load topics:", err);
            }
        }

        function renderTopicBar() {
            const bar = document.getElementById('topic-bar');
            const showingAll = selectedTopics.length === 0;

            let html = `<div class="topic-pill ${showingAll ? 'active' : ''}"
                             style="${showingAll ? 'background:#e2e8f0' : ''}"
                             onclick="clearTopics()">All</div>`;

            availableTopics.forEach(topic => {
                const isOn = selectedTopics.includes(topic.slug);
                const style = isOn
                    ? `background:${topic.accent_color};color:${contrastText(topic.accent_color)}`
                    : '';
                html += `<div class="topic-pill ${isOn ? 'active' : ''}" style="${style}"
                              onclick="toggleTopic('${topic.slug}')">
                            ${escapeHtml(topic.label)}
                            <span class="pill-count">${topic.article_count}</span>
                         </div>`;
            });

            bar.innerHTML = html;
        }

        function toggleTopic(slug) {
            const pos = selectedTopics.indexOf(slug);
            if (pos === -1) {
                selectedTopics.push(slug);
            } else {
                selectedTopics.splice(pos, 1);
            }
            renderTopicBar();
            loadFeed();
        }

        function clearTopics() {
            selectedTopics = [];
            renderTopicBar();
            loadFeed();
        }

        async function loadFeed() {
            try {
                const params = new URLSearchParams();
                if (selectedTopics.length > 0) {
                    params.set('categories', selectedTopics.join(','));
                }
                const qs = params.toString();
                const response = await fetch('/api/v1/feed' + (qs ? '?' + qs : ''));
                const data = await response.json();
                articlesQueue = data.articles || [];
                currentIndex = 0;
                historyStack = [];
                renderDeck();
            } catch (err) {
                console.error("Failed to load feed:", err);
            }
        }

        function buildCardInner(article) {
            const accent = article.accent_color || '#6366f1';
            const label = article.category_label || article.category || 'TECH';
            const media = article.image_url
                ? `<img src="${escapeHtml(article.image_url)}" alt="" onerror="this.style.display='none'">`
                : '';
            return `
                <div class="swipe-badge badge-read">READ →</div>
                <div class="swipe-badge badge-pass">SKIP</div>
                <div class="card-media">
                    ${media}
                    <span class="cat-chip" style="background:${accent};color:${contrastText(accent)}">${escapeHtml(label)}</span>
                </div>
                <div class="card-content">
                    <div class="card-title">${escapeHtml(article.title)}</div>
                    <div class="card-desc">${escapeHtml(article.description || '')}</div>
                    <div class="card-meta">
                        <span class="src">${escapeHtml(article.source || '')}</span>
                        <span>${escapeHtml(article.published_at || '')}</span>
                    </div>
                </div>
            `;
        }

        function renderDeck() {
            const container = document.getElementById('deck-container');
            const counter = document.getElementById('queue-counter');

            document.querySelectorAll('.swipe-card').forEach(c => c.remove());

            if (currentIndex >= articlesQueue.length) {
                document.getElementById('empty-state').style.display = 'flex';
                counter.innerText = "Done!";
                return;
            } else {
                document.getElementById('empty-state').style.display = 'none';
                counter.innerText = `Card ${currentIndex + 1} / ${articlesQueue.length}`;
            }

            const maxVisible = Math.min(3, articlesQueue.length - currentIndex);
            for (let i = maxVisible - 1; i >= 0; i--) {
                const idx = currentIndex + i;
                const article = articlesQueue[idx];

                const card = document.createElement('div');
                card.className = 'swipe-card';
                card.id = `card-${idx}`;

                const scale = 1 - (i * 0.04);
                const translateY = i * 12;
                card.style.transform = `translateY(${translateY}px) scale(${scale})`;
                card.style.zIndex = 10 - i;

                card.innerHTML = buildCardInner(article);

                if (i === 0) {
                    activeCardEl = card;
                    attachDragListeners(card, article);
                }

                container.appendChild(card);
            }
        }

        function attachDragListeners(card, article) {
            // pointermove/pointerup are bound to window ONLY for the duration of a
            // drag. They used to be bound here at render time and torn down only
            // inside handleDragEnd, so any render that didn't end in a completed
            // drag (button swipe, undo, feed reload) leaked a handler pair closed
            // over a stale card + article. Because the drag state below is shared,
            // every leaked handler also fired on the next pointerup and opened the
            // PREVIOUS article's URL.
            function detach() {
                window.removeEventListener('pointermove', handleDragMove);
                window.removeEventListener('pointerup', handleDragEnd);
                window.removeEventListener('pointercancel', handleDragEnd);
            }

            card.addEventListener('pointerdown', handleDragStart);

            function handleDragStart(e) {
                if (card !== activeCardEl) return;   // only the front card drags
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                card.style.transition = 'none';

                detach();                            // belt and braces
                window.addEventListener('pointermove', handleDragMove);
                window.addEventListener('pointerup', handleDragEnd);
                window.addEventListener('pointercancel', handleDragEnd);
            }

            function handleDragMove(e) {
                if (!isDragging) return;
                currentX = e.clientX - startX;
                currentY = e.clientY - startY;

                const rotate = currentX * 0.08;
                card.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;

                const badgeRead = card.querySelector('.badge-read');
                const badgePass = card.querySelector('.badge-pass');

                if (currentX > 30) {
                    badgeRead.style.opacity = Math.min(1, currentX / 120);
                    badgePass.style.opacity = 0;
                } else if (currentX < -30) {
                    badgePass.style.opacity = Math.min(1, Math.abs(currentX) / 120);
                    badgeRead.style.opacity = 0;
                } else {
                    badgeRead.style.opacity = 0;
                    badgePass.style.opacity = 0;
                }
            }

            function handleDragEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                detach();
                card.style.transition = 'transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

                const threshold = 110;
                const dx = currentX;
                currentX = 0;
                currentY = 0;

                if (dx > threshold) {
                    completeSwipe('right');
                } else if (dx < -threshold) {
                    completeSwipe('left');
                } else {
                    card.style.transform = 'translate(0px, 0px) rotate(0deg)';
                    card.querySelector('.badge-read').style.opacity = 0;
                    card.querySelector('.badge-pass').style.opacity = 0;
                }
            }
        }

        function triggerSwipe(direction) {
            if (!activeCardEl || currentIndex >= articlesQueue.length) return;
            completeSwipe(direction);
        }

        function logSwipe(article, direction) {
            // right = interested/read, left = pass
            const action = direction === 'right' ? 'read' : 'pass';
            fetch('/api/v1/swipe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ article_id: article.id, action })
            }).catch(err => console.error('swipe log failed:', err));
        }

        function completeSwipe(direction) {
            if (!activeCardEl || isSwiping) return;
            // Resolve the article from the queue at swipe time rather than from a
            // captured variable, so the URL always belongs to the visible card.
            const article = articlesQueue[currentIndex];
            if (!article) return;

            isSwiping = true;
            logSwipe(article, direction);

            const flyX = direction === 'right' ? window.innerWidth : -window.innerWidth;
            const flyRotate = direction === 'right' ? 30 : -30;

            activeCardEl.style.transition = 'transform 0.45s ease-in, opacity 0.4s';
            activeCardEl.style.transform = `translate(${flyX}px, ${currentY || 0}px) rotate(${flyRotate}deg)`;
            activeCardEl.style.opacity = '0';

            historyStack.push({ index: currentIndex, direction: direction });

            // Open the tab immediately: browsers block window.open from a timeout
            // because it is no longer tied to the user's gesture.
            if (direction === 'right') {
                window.open(article.url, '_blank', 'noopener');
            }

            setTimeout(() => {
                currentIndex++;
                isSwiping = false;
                renderDeck();
            }, 300);
        }

        function undoSwipe() {
            if (historyStack.length === 0 || isSwiping) return;
            const last = historyStack.pop();
            currentIndex = last.index;
            renderDeck();
        }

        function reloadFeed() {
            loadFeed();
        }

        // Telemetry Active Session Heartbeat
        (function initTelemetry() {
            let sessionId = localStorage.getItem('paperswap_session_id');
            if (!sessionId) {
                sessionId = 'sess_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
                localStorage.setItem('paperswap_session_id', sessionId);
            }
            function sendHeartbeat() {
                fetch('/api/v1/telemetry/heartbeat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, user_agent: navigator.userAgent })
                }).catch(() => {});
            }
            sendHeartbeat();
            setInterval(sendHeartbeat, 15000);
        })();

        loadTopics();
        loadFeed();
    </script>
</body>
</html>
