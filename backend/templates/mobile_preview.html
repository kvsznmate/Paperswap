<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PaperSwap - MVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090c15;
            --card-bg: #121824;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #6366f1;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.15), transparent 60%);
        }

        .app-shell {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            max-height: 900px;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #0d121d;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        @media (min-width: 480px) {
            .app-shell {
                height: 92vh;
                border-radius: 40px;
                border: 4px solid #1e2638;
            }
        }

        .app-header {
            padding: 18px 24px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .queue-counter {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            background: rgba(30, 41, 59, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .deck-container {
            flex: 1;
            position: relative;
            margin: 10px 16px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .swipe-card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 28px;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            cursor: grab;
            touch-action: none;
            will-change: transform;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
        }

        .swipe-card:active { cursor: grabbing; }

        /* ---- Card rendered from article fields (no server PNG) ---- */
        .card-media {
            position: relative;
            flex: 0 0 56%;
            background: linear-gradient(150deg, #1b2333, #2a3450);
            overflow: hidden;
        }
        .card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            display: block;
        }
        .card-media::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(9,12,21,0) 45%, rgba(9,12,21,0.55) 100%);
        }
        .cat-chip {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 2;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 6px 12px;
            border-radius: 999px;
            color: #0b0f18;
        }
        /* Chip colour comes from the API (accent_color per topic) so the palette
           lives in one place on the backend instead of drifting per client. */

        /* ---- Topic filter bar ---- */
        .topic-bar {
            display: flex;
            gap: 8px;
            padding: 4px 16px 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            flex: 0 0 auto;
            z-index: 20;
        }
        .topic-bar::-webkit-scrollbar { display: none; }

        .topic-pill {
            flex: 0 0 auto;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
            padding: 7px 14px;
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            color: var(--text-sub);
            background: rgba(30, 41, 59, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.18s ease;
        }
        .topic-pill:active { transform: scale(0.94); }
        .topic-pill.active {
            color: #0b0f18;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }
        .topic-pill .pill-count {
            opacity: 0.65;
            font-weight: 600;
            margin-left: 4px;
        }

        .card-content {
            flex: 1;
            padding: 20px 22px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: linear-gradient(180deg, #141b29 0%, var(--card-bg) 60%);
        }
        .card-title {
            font-size: 22px;
            line-height: 1.22;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: var(--text-main);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-desc {
            font-size: 14.5px;
            line-height: 1.5;
            color: var(--text-sub);
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-meta {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: #6b7688;
            border-top: 1px solid rgba(255,255,255,0.07);
            padding-top: 12px;
        }
        .card-meta .src {
            font-weight: 700;
            color: #aeb7c7;
            max-width: 55%;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .swipe-badge {
            position: absolute;
            top: 40px;
            font-size: 28px;
            font-weight: 800;
            padding: 8px 24px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 30;
            pointer-events: none;
        }
        .badge-read {
            right: 30px;
            color: var(--accent-green);
            border: 4px solid var(--accent-green);
            transform: rotate(15deg);
        }
        .badge-pass {
            left: 30px;
            color: var(--accent-red);
            border: 4px solid var(--accent-red);
            transform: rotate(-15deg);
        }

        .app-actions {
            padding: 10px 30px 25px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
        }
        .action-btn {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(22, 30, 46, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        .action-btn:active { transform: scale(0.88); }
        .btn-pass { color: var(--accent-red); border-color: rgba(239, 68, 68, 0.3); }
        .btn-pass:hover { background: rgba(239, 68, 68, 0.15); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
        .btn-read {
            width: 72px;
            height: 72px;
            font-size: 30px;
            color: var(--accent-green);
            border-color: rgba(16, 185, 129, 0.4);
            background: rgba(16, 185, 129, 0.15);
        }
        .btn-read:hover { background: rgba(16, 185, 129, 0.3); box-shadow: 0 0 25px rgba(16, 185, 129, 0.5); }
        .btn-undo { color: var(--accent-amber); border-color: rgba(245, 158, 11, 0.3); font-size: 22px; }

        .empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            height: 100%;
        }
        .empty-state h3 { font-size: 22px; margin: 15px 0 10px; }
        .empty-state p { font-size: 14px; color: var(--text-sub); margin-bottom: 25px; }
        .btn-reload {
            background: linear-gradient(135deg, var(--accent-blue), #4f46e5);
            color: #fff;
            padding: 12px 28px;
            border-radius: 14px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
        }
        /* ---- Top navigation ---- */
        .main-nav {
            display: flex;
            gap: 5px;
            padding: 4px;
            margin: 0 20px 10px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 14px;
            flex: 0 0 auto;
            z-index: 20;
        }
        .nav-tab {
            flex: 1;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.2px;
            padding: 9px 0;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-sub);
            cursor: pointer;
            transition: background 0.18s ease, color 0.18s ease;
        }
        .nav-tab:active { transform: scale(0.97); }
        .nav-tab.active {
            background: linear-gradient(135deg, var(--accent-blue), #4f46e5);
            color: #fff;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }

        /* Each view owns the remaining height and scrolls internally, so the
           header and nav never move. [hidden] needs an explicit rule because
           display:flex below would otherwise beat the attribute's default. */
        .view {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .view[hidden] { display: none; }

        /* ---- Summaries: topic chooser ---- */
        .topic-circles {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px 10px;
            padding: 4px 16px 14px;
            flex: 0 0 auto;
        }
        .topic-circle {
            width: 66px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 0;
            border: none;
            background: none;
            font-family: inherit;
            cursor: pointer;
        }
        .circle-dot {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        opacity 0.18s ease, box-shadow 0.18s ease;
        }
        .topic-circle:active .circle-dot { transform: scale(0.9); }
        .circle-label {
            font-size: 10.5px;
            font-weight: 600;
            line-height: 1.25;
            text-align: center;
            color: var(--text-sub);
            transition: color 0.18s ease;
        }
        .topic-circle.selected .circle-dot { transform: scale(1.07); }
        .topic-circle.selected .circle-label { color: var(--text-main); }
        /* Dim the unpicked ones only once something IS picked, so the default
           state reads as an even choice rather than as six disabled buttons. */
        .topic-circles.has-selection .topic-circle:not(.selected) .circle-dot { opacity: 0.34; }

        /* ---- Summaries: detail panel ---- */
        .summary-panel {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 22px 30px;
        }
        .summary-topic {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -0.6px;
            line-height: 1.15;
        }
        .summary-dates {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
        }
        .week-step {
            width: 22px;
            height: 22px;
            flex: 0 0 auto;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(30, 41, 59, 0.65);
            color: var(--text-sub);
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .week-step:disabled { opacity: 0.22; cursor: default; }
        .summary-text {
            margin-top: 17px;
            font-size: 15px;
            line-height: 1.62;
            color: #dbe2ec;
            user-select: text;
            -webkit-user-select: text;
        }
        .stat {
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
        }
        .stat-label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #6b7688;
        }
        .stat-value { font-size: 16px; font-weight: 700; margin-top: 6px; }
        .stat-sub { font-size: 12px; color: var(--text-sub); margin-top: 4px; line-height: 1.45; }
        .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
        .chip {
            font-size: 11.5px;
            font-weight: 600;
            padding: 5px 11px;
            border-radius: 999px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #aeb7c7;
        }
        .summary-foot {
            margin-top: 22px;
            font-size: 10.5px;
            line-height: 1.55;
            color: #5a6474;
        }
        .summary-prompt,
        .summary-empty {
            text-align: center;
            padding: 34px 14px;
            font-size: 13.5px;
            line-height: 1.6;
            color: var(--text-sub);
        }
        .summary-empty strong { color: var(--text-main); font-weight: 700; display: block; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div class="app-shell">
        <header class="app-header">
            <div class="brand-logo">
                <svg width="24" height="24" viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="108" height="108" rx="28" fill="url(#mob-logo-grad)"/>
                    <path d="M54 20L24 65h24l-6 23 36-45h-24z" fill="#FFFFFF"/>
                    <defs>
                        <linearGradient id="mob-logo-grad" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#818CF8"/>
                            <stop offset="1" stop-color="#6366F1"/>
                        </linearGradient>
                    </defs>
                </svg> PaperSwap
            </div>
            <div class="queue-counter" id="queue-counter">Card 1 / 50</div>
        </header>

        <nav class="main-nav">
            <button class="nav-tab active" id="tab-cards" onclick="switchView('cards')">Cards</button>
            <button class="nav-tab" id="tab-summaries" onclick="switchView('summaries')">Weekly Summaries</button>
        </nav>

        <div class="view" id="view-cards">
            <div class="topic-bar" id="topic-bar"></div>

            <div class="deck-container" id="deck-container">
                <div class="empty-state" id="empty-state">
                    <h3>All caught up!</h3>
                    <p id="empty-message">You've swiped every headline in this mix. Pull a fresh batch or switch topics to keep going.</p>
                    <button class="btn-reload" onclick="reloadFeed()">Reload Feed</button>
                </div>
            </div>

            <footer class="app-actions">
                <button class="action-btn btn-undo" title="Undo last swipe" onclick="undoSwipe()">↩</button>
                <button class="action-btn btn-pass" title="Pass / Skip" onclick="triggerSwipe('left')">✖</button>
                <button class="action-btn btn-read" title="Read Article" onclick="triggerSwipe('right')">💚</button>
            </footer>
        </div>

        <div class="view" id="view-summaries" hidden>
            <div class="topic-circles" id="topic-circles"></div>
            <div class="summary-panel" id="summary-panel">
                <div class="summary-prompt">Pick a topic above to read its week.</div>
            </div>
        </div>
    </div>

    <script>
        let articlesQueue = [];
        let currentIndex = 0;
        let historyStack = [];
        let activeCardEl = null;
        // Guards completeSwipe against re-entry, so one gesture can never advance
        // the deck twice or open two tabs.
        let isSwiping = false;

        // Topic filtering state. Empty selectedTopics = show every topic.
        let availableTopics = [];
        let selectedTopics = [];

        let startX = 0, startY = 0;
        let currentX = 0, currentY = 0;
        let isDragging = false;

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str == null ? '' : str;
            return d.innerHTML;
        }

        // Pick readable text for a topic accent colour (BT.601 perceived luminance),
        // so amber and indigo chips are both legible without a hand-tuned map.
        function contrastText(hex) {
            const h = String(hex || '').replace('#', '');
            if (h.length !== 6) return '#0b0f18';
            const r = parseInt(h.slice(0, 2), 16);
            const g = parseInt(h.slice(2, 4), 16);
            const b = parseInt(h.slice(4, 6), 16);
            return ((r * 299 + g * 587 + b * 114) / 1000) > 150 ? '#0b0f18' : '#ffffff';
        }

        async function loadTopics() {
            try {
                const response = await fetch('/api/v1/categories');
                const data = await response.json();
                availableTopics = data.categories || [];
                renderTopicBar();
            } catch (err) {
                console.error("Failed to load topics:", err);
            }
        }

        function renderTopicBar() {
            const bar = document.getElementById('topic-bar');
            const showingAll = selectedTopics.length === 0;

            let html = `<div class="topic-pill ${showingAll ? 'active' : ''}"
                             style="${showingAll ? 'background:#e2e8f0' : ''}"
                             onclick="clearTopics()">All</div>`;

            availableTopics.forEach(topic => {
                const isOn = selectedTopics.includes(topic.slug);
                const style = isOn
                    ? `background:${topic.accent_color};color:${contrastText(topic.accent_color)}`
                    : '';
                html += `<div class="topic-pill ${isOn ? 'active' : ''}" style="${style}"
                              onclick="toggleTopic('${topic.slug}')">
                            ${escapeHtml(topic.label)}
                            <span class="pill-count">${topic.article_count}</span>
                         </div>`;
            });

            bar.innerHTML = html;
        }

        function toggleTopic(slug) {
            const pos = selectedTopics.indexOf(slug);
            if (pos === -1) {
                selectedTopics.push(slug);
            } else {
                selectedTopics.splice(pos, 1);
            }
            renderTopicBar();
            loadFeed();
        }

        function clearTopics() {
            selectedTopics = [];
            renderTopicBar();
            loadFeed();
        }

        async function loadFeed() {
            try {
                const params = new URLSearchParams();
                if (selectedTopics.length > 0) {
                    params.set('categories', selectedTopics.join(','));
                }
                const qs = params.toString();
                const response = await fetch('/api/v1/feed' + (qs ? '?' + qs : ''));
                const data = await response.json();
                articlesQueue = data.articles || [];
                currentIndex = 0;
                historyStack = [];
                renderDeck();
            } catch (err) {
                console.error("Failed to load feed:", err);
            }
        }

        function buildCardInner(article) {
            const accent = article.accent_color || '#6366f1';
            const label = article.category_label || article.category || 'TECH';
            const media = article.image_url
                ? `<img src="${escapeHtml(article.image_url)}" alt="" onerror="this.style.display='none'">`
                : '';
            return `
                <div class="swipe-badge badge-read">READ →</div>
                <div class="swipe-badge badge-pass">SKIP</div>
                <div class="card-media">
                    ${media}
                    <span class="cat-chip" style="background:${accent};color:${contrastText(accent)}">${escapeHtml(label)}</span>
                </div>
                <div class="card-content">
                    <div class="card-title">${escapeHtml(article.title)}</div>
                    <div class="card-desc">${escapeHtml(article.description || '')}</div>
                    <div class="card-meta">
                        <span class="src">${escapeHtml(article.source || '')}</span>
                        <span>${escapeHtml(article.published_at || '')}</span>
                    </div>
                </div>
            `;
        }

        function renderDeck() {
            const container = document.getElementById('deck-container');
            const counter = document.getElementById('queue-counter');

            document.querySelectorAll('.swipe-card').forEach(c => c.remove());

            if (currentIndex >= articlesQueue.length) {
                document.getElementById('empty-state').style.display = 'flex';
                counter.innerText = "Done!";
                return;
            } else {
                document.getElementById('empty-state').style.display = 'none';
                counter.innerText = `Card ${currentIndex + 1} / ${articlesQueue.length}`;
            }

            const maxVisible = Math.min(3, articlesQueue.length - currentIndex);
            for (let i = maxVisible - 1; i >= 0; i--) {
                const idx = currentIndex + i;
                const article = articlesQueue[idx];

                const card = document.createElement('div');
                card.className = 'swipe-card';
                card.id = `card-${idx}`;

                const scale = 1 - (i * 0.04);
                const translateY = i * 12;
                card.style.transform = `translateY(${translateY}px) scale(${scale})`;
                card.style.zIndex = 10 - i;

                card.innerHTML = buildCardInner(article);

                if (i === 0) {
                    activeCardEl = card;
                    attachDragListeners(card, article);
                }

                container.appendChild(card);
            }
        }

        function attachDragListeners(card, article) {
            // pointermove/pointerup are bound to window ONLY for the duration of a
            // drag. They used to be bound here at render time and torn down only
            // inside handleDragEnd, so any render that didn't end in a completed
            // drag (button swipe, undo, feed reload) leaked a handler pair closed
            // over a stale card + article. Because the drag state below is shared,
            // every leaked handler also fired on the next pointerup and opened the
            // PREVIOUS article's URL.
            function detach() {
                window.removeEventListener('pointermove', handleDragMove);
                window.removeEventListener('pointerup', handleDragEnd);
                window.removeEventListener('pointercancel', handleDragEnd);
            }

            card.addEventListener('pointerdown', handleDragStart);

            function handleDragStart(e) {
                if (card !== activeCardEl) return;   // only the front card drags
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                card.style.transition = 'none';

                detach();                            // belt and braces
                window.addEventListener('pointermove', handleDragMove);
                window.addEventListener('pointerup', handleDragEnd);
                window.addEventListener('pointercancel', handleDragEnd);
            }

            function handleDragMove(e) {
                if (!isDragging) return;
                currentX = e.clientX - startX;
                currentY = e.clientY - startY;

                const rotate = currentX * 0.08;
                card.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;

                const badgeRead = card.querySelector('.badge-read');
                const badgePass = card.querySelector('.badge-pass');

                if (currentX > 30) {
                    badgeRead.style.opacity = Math.min(1, currentX / 120);
                    badgePass.style.opacity = 0;
                } else if (currentX < -30) {
                    badgePass.style.opacity = Math.min(1, Math.abs(currentX) / 120);
                    badgeRead.style.opacity = 0;
                } else {
                    badgeRead.style.opacity = 0;
                    badgePass.style.opacity = 0;
                }
            }

            function handleDragEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                detach();
                card.style.transition = 'transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

                const threshold = 110;
                const dx = currentX;
                currentX = 0;
                currentY = 0;

                if (dx > threshold) {
                    completeSwipe('right');
                } else if (dx < -threshold) {
                    completeSwipe('left');
                } else {
                    card.style.transform = 'translate(0px, 0px) rotate(0deg)';
                    card.querySelector('.badge-read').style.opacity = 0;
                    card.querySelector('.badge-pass').style.opacity = 0;
                }
            }
        }

        function triggerSwipe(direction) {
            if (!activeCardEl || currentIndex >= articlesQueue.length) return;
            completeSwipe(direction);
        }

        function logSwipe(article, direction) {
            // right = interested/read, left = pass
            const action = direction === 'right' ? 'read' : 'pass';
            // Same id as the heartbeat. Lets the server store at most one swipe
            // per article for this browser; storage may be unavailable, in which
            // case the field is simply omitted.
            let sessionId = null;
            try { sessionId = localStorage.getItem('paperswap_session_id'); } catch (e) {}
            const body = { article_id: article.id, action };
            if (sessionId) body.session_id = sessionId.slice(0, 64);
            fetch('/api/v1/swipe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            }).then(res => {
                if (res.ok) return;
                // A swallowed failure here is invisible: the deck keeps working
                // because swiping is client-side, so the only symptom would be
                // silently missing engagement data. Surface it instead.
                if (res.status === 503) {
                    console.warn('swipe rejected (503): server-wide swipe budget is spent');
                    showSwipeWarning('The server is busy - swipes are not being recorded right now.');
                } else if (res.status === 429) {
                    console.warn('swipe rate limited (429) - this swipe was NOT recorded');
                    showSwipeWarning('Swiping faster than the server accepts - some swipes are not being recorded.');
                } else {
                    console.error(`swipe log failed: HTTP ${res.status}`);
                }
            }).catch(err => console.error('swipe log failed:', err));
        }

        // Non-blocking notice; the deck stays usable either way.
        let swipeWarningTimer = null;
        function showSwipeWarning(msg) {
            let el = document.getElementById('swipe-warning');
            if (!el) {
                el = document.createElement('div');
                el.id = 'swipe-warning';
                el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:24px;'
                    + 'max-width:88%;background:#2a1414;border:1px solid #5a2626;color:#ffb4b4;'
                    + 'padding:10px 14px;border-radius:10px;font-size:12px;line-height:1.45;'
                    + 'z-index:9999;text-align:center;';
                document.body.appendChild(el);
            }
            el.textContent = msg;
            el.style.display = 'block';
            clearTimeout(swipeWarningTimer);
            swipeWarningTimer = setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        function completeSwipe(direction) {
            if (!activeCardEl || isSwiping) return;
            // Resolve the article from the queue at swipe time rather than from a
            // captured variable, so the URL always belongs to the visible card.
            const article = articlesQueue[currentIndex];
            if (!article) return;

            isSwiping = true;
            logSwipe(article, direction);

            const flyX = direction === 'right' ? window.innerWidth : -window.innerWidth;
            const flyRotate = direction === 'right' ? 30 : -30;

            activeCardEl.style.transition = 'transform 0.45s ease-in, opacity 0.4s';
            activeCardEl.style.transform = `translate(${flyX}px, ${currentY || 0}px) rotate(${flyRotate}deg)`;
            activeCardEl.style.opacity = '0';

            historyStack.push({ index: currentIndex, direction: direction });

            // Open the tab immediately: browsers block window.open from a timeout
            // because it is no longer tied to the user's gesture.
            if (direction === 'right') {
                window.open(article.url, '_blank', 'noopener');
            }

            setTimeout(() => {
                currentIndex++;
                isSwiping = false;
                renderDeck();
            }, 300);
        }

        function undoSwipe() {
            if (historyStack.length === 0 || isSwiping) return;
            const last = historyStack.pop();
            currentIndex = last.index;
            renderDeck();
        }

        function reloadFeed() {
            loadFeed();
        }

        /* ================= VIEW SWITCHING ================= */

        let activeView = 'cards';

        function switchView(view) {
            activeView = view;
            document.getElementById('view-cards').hidden = (view !== 'cards');
            document.getElementById('view-summaries').hidden = (view !== 'summaries');
            document.getElementById('tab-cards').classList.toggle('active', view === 'cards');
            document.getElementById('tab-summaries').classList.toggle('active', view === 'summaries');
            // The card counter describes the deck, so it has nothing to say here.
            document.getElementById('queue-counter').style.visibility =
                (view === 'cards') ? 'visible' : 'hidden';

            // Views are shown and hidden rather than reloaded, so the deck keeps
            // its position and the user does not lose their place by glancing at
            // a summary.
            if (view === 'summaries' && summaryTopics.length === 0) {
                loadSummaryTopics();
            }
        }

        /* ================= WEEKLY SUMMARIES ================= */

        let summaryTopics = [];        // catalogue, for the circles
        let selectedTopic = null;      // slug currently being read
        let summaryHistory = [];       // that topic's weeks, newest first
        let weekIndex = 0;             // which week of summaryHistory is shown

        // Two letters from the slug rather than one. TECH/FINANCE/SPORTS are all
        // distinct on their initial, but POLITICS and PROGRAMMING are not, and a
        // hardcoded icon map would drift from the server-side catalogue the
        // moment a topic is added (see ADR-006).
        function topicInitials(slug) {
            return String(slug || '?').slice(0, 2).toUpperCase();
        }

        // Both dates are formatted by the locale rather than assembled by hand.
        // Appending the year manually produced "Aug 30 2026" in en-US, which is
        // missing the comma the locale would have added; letting Intl place the
        // year also keeps day/month order right for en-GB and friends.
        function fmtDay(iso, withYear) {
            const opts = { day: 'numeric', month: 'short', timeZone: 'UTC' };
            if (withYear) opts.year = 'numeric';
            return new Date(iso + 'T00:00:00Z').toLocaleDateString(undefined, opts);
        }

        function fmtRange(startIso, endIso) {
            return fmtDay(startIso, false) + ' \u2013 ' + fmtDay(endIso, true);
        }

        async function loadSummaryTopics() {
            try {
                const res = await fetch('/api/v1/categories');
                const data = await res.json();
                summaryTopics = data.categories || [];
                renderTopicCircles();
            } catch (err) {
                document.getElementById('topic-circles').innerHTML = '';
                document.getElementById('summary-panel').innerHTML =
                    '<div class="summary-empty"><strong>Could not load topics.</strong>' +
                    'Check that the backend is reachable and try again.</div>';
            }
        }

        function renderTopicCircles() {
            const wrap = document.getElementById('topic-circles');
            wrap.classList.toggle('has-selection', selectedTopic !== null);

            wrap.innerHTML = summaryTopics.map(t => {
                const on = t.slug === selectedTopic;
                // Colour comes from the API, so the palette stays in one place on
                // the backend. contrastText keeps the initials legible on amber
                // and on indigo without a per-topic override.
                const ring = on
                    ? 'box-shadow:0 0 0 3px ' + t.accent_color + '55, 0 6px 18px ' + t.accent_color + '66;'
                    : '';
                return '<button class="topic-circle ' + (on ? 'selected' : '') + '"' +
                       ' onclick="selectTopic(\'' + t.slug + '\')"' +
                       ' aria-pressed="' + on + '"' +
                       ' title="' + escapeHtml(t.label) + '">' +
                       '<span class="circle-dot" style="background:' + t.accent_color +
                       ';color:' + contrastText(t.accent_color) + ';' + ring + '">' +
                       topicInitials(t.slug) + '</span>' +
                       '<span class="circle-label">' + escapeHtml(t.label) + '</span>' +
                       '</button>';
            }).join('');
        }

        async function selectTopic(slug) {
            selectedTopic = slug;
            weekIndex = 0;
            summaryHistory = [];
            renderTopicCircles();

            const panel = document.getElementById('summary-panel');
            panel.innerHTML = '<div class="summary-prompt">Loading\u2026</div>';
            panel.scrollTop = 0;

            try {
                const res = await fetch('/api/v1/summaries/' + encodeURIComponent(slug) + '?weeks=8');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                summaryHistory = data.summaries || [];
                renderSummary();
            } catch (err) {
                panel.innerHTML =
                    '<div class="summary-empty"><strong>Could not load this summary.</strong>' +
                    escapeHtml(err.message) + '</div>';
            }
        }

        function stepWeek(delta) {
            const next = weekIndex + delta;
            if (next < 0 || next >= summaryHistory.length) return;
            weekIndex = next;
            renderSummary();
        }

        function renderSummary() {
            const panel = document.getElementById('summary-panel');
            const topic = summaryTopics.find(t => t.slug === selectedTopic);

            if (!summaryHistory.length) {
                // Not an error. A topic gets no row for a week when too few of its
                // articles carried a real publisher description, and saying so is
                // more useful than an empty card.
                panel.innerHTML =
                    '<div class="summary-empty"><strong>No summary yet for ' +
                    escapeHtml(topic ? topic.label : selectedTopic) + '.</strong>' +
                    'Summaries are written once a week, for the last completed ' +
                    'Monday\u2013Sunday. A topic is skipped when too few of its articles ' +
                    'that week came with a real publisher description.</div>';
                return;
            }

            const s = summaryHistory[weekIndex];
            const filtered = s.number_of_articles !== s.articles_in_window;

            const sources = (s.top_sources || []).length
                ? '<div class="chips">' + s.top_sources.map(x =>
                      '<span class="chip">' + escapeHtml(x) + '</span>').join('') + '</div>'
                : '<div class="stat-sub">No source breakdown stored for this week.</div>';

            const articleNote = filtered
                ? 'Summarised from ' + s.number_of_articles + ' of the ' +
                  s.articles_in_window + ' collected this week. The rest carried a generic ' +
                  'description rather than the publisher\u2019s own.'
                : 'Every article collected this week was used.';

            panel.innerHTML =
                '<div class="summary-topic" style="color:' + s.accent_color + '">' +
                    escapeHtml(s.topic_label) +
                '</div>' +

                '<div class="summary-dates">' +
                    '<button class="week-step" onclick="stepWeek(1)" title="Earlier week"' +
                        (weekIndex >= summaryHistory.length - 1 ? ' disabled' : '') +
                        '>\u2039</button>' +
                    '<span>' + fmtRange(s.week_start, s.week_end) + '</span>' +
                    '<button class="week-step" onclick="stepWeek(-1)" title="Later week"' +
                        (weekIndex <= 0 ? ' disabled' : '') +
                        '>\u203a</button>' +
                '</div>' +

                '<p class="summary-text">' + escapeHtml(s.summary) + '</p>' +

                '<div class="stat">' +
                    '<div class="stat-label">Articles</div>' +
                    '<div class="stat-value">' + s.number_of_articles + '</div>' +
                    '<div class="stat-sub">' + articleNote + '</div>' +
                '</div>' +

                '<div class="stat">' +
                    '<div class="stat-label">Top sources</div>' +
                    sources +
                '</div>' +

                '<div class="summary-foot">' + escapeHtml(s.basis || '') +
                    ' Written by <b>' + escapeHtml(s.generator) + '</b>.</div>';

            panel.scrollTop = 0;
        }

        // Telemetry Active Session Heartbeat
        (function initTelemetry() {
            let sessionId = localStorage.getItem('paperswap_session_id');
            if (!sessionId) {
                sessionId = 'sess_' + Math.random().toString(36).substring(2) + Date.now().toString(36);
                localStorage.setItem('paperswap_session_id', sessionId);
            }
            function sendHeartbeat() {
                fetch('/api/v1/telemetry/heartbeat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, user_agent: navigator.userAgent })
                }).catch(() => {});
            }
            sendHeartbeat();
            setInterval(sendHeartbeat, 15000);
        })();

        loadTopics();
        loadFeed();

        // Deep link: /summaries opens straight on that tab, so the route still
        // works and can be bookmarked. Everything else lands on the deck.
        if (window.location.pathname.replace(/\/+$/, '') === '/summaries') {
            switchView('summaries');
        }
    </script>
</body>
</html>
