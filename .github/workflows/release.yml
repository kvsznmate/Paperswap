# Signed Android release (#65). Pushing a tag vX.Y builds the release APK,
# signs it with the release key and attaches it to a GitHub Release, where
# people download and sideload it.
#
#   git tag v1.1 && git push origin v1.1      (tag a commit on main)
#
# The tag must match versionName in android/app/build.gradle.kts. The key comes
# from repository secrets (android/README.md, "Releasing"):
#   PAPERSWAP_KEYSTORE_BASE64        the .jks file, base64-encoded
#   PAPERSWAP_SIGNING_STORE_PASSWORD
#   PAPERSWAP_SIGNING_KEY_ALIAS
#   PAPERSWAP_SIGNING_KEY_PASSWORD
# Optional repository variable PAPERSWAP_BASE_URL: the backend the APK talks
# to. Unset, it keeps the Gradle default (the Tailscale address).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          tag="${GITHUB_REF_NAME#v}"
          echo "versionName=$version tag=$tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version. Bump versionName and versionCode first."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Release key present
        env:
          KEYSTORE_BASE64: ${{ secrets.PAPERSWAP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PAPERSWAP_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PAPERSWAP_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PAPERSWAP_SIGNING_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository secret for $v is not set (android/README.md, Releasing)."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6

      - name: Build signed release APK
        env:
          PAPERSWAP_SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          PAPERSWAP_SIGNING_STORE_PASSWORD: ${{ secrets.PAPERSWAP_SIGNING_STORE_PASSWORD }}
          PAPERSWAP_SIGNING_KEY_ALIAS: ${{ secrets.PAPERSWAP_SIGNING_KEY_ALIAS }}
          PAPERSWAP_SIGNING_KEY_PASSWORD: ${{ secrets.PAPERSWAP_SIGNING_KEY_PASSWORD }}
          BASE_URL: ${{ vars.PAPERSWAP_BASE_URL }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease ${BASE_URL:+-Ppaperswap.baseUrl=$BASE_URL}

      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | grep -E "Signer #1 certificate (DN|SHA-256)"
          cp "$apk" "$RUNNER_TEMP/paperswap-$VERSION.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/paperswap-$VERSION.apk" \
            --title "Paperswap $VERSION" --generate-notes --verify-tag

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
