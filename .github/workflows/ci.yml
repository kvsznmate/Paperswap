# CI (#34). Every PR into dev or main, and every push to them, runs four jobs:
#
#   lint           ruff over backend/ (pyflakes + syntax; see backend/ruff.toml)
#   backend-tests  every backend/tests/test_*.py against a throwaway Postgres 16
#   docker         builds the production image, starts docker-compose.yml with
#                  dummy secrets, and checks the API actually serves
#   android        compiles the debug APK and the release Kotlin (R8 config)
#
# Nothing here deploys. Nothing here needs a secret: the docker job uses dummy
# keys.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR or branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "$(grep '^ruff' requirements-dev.txt)"
      - run: ruff check --output-format=github .

  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        options: >-
          --health-cmd "pg_isready -U test -d testdb"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/testdb
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # the Dockerfile's base image
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # The suites are standalone scripts, not pytest (see tests/README.md).
      # Run every one even after a failure, so a single red run lists all of
      # them, then fail the job if any did.
      - name: Run test suites
        run: |
          failed=""
          for t in tests/test_*.py; do
            echo "::group::$t"
            if python "$t"; then echo "::endgroup::"; else echo "::endgroup::"; echo "::error file=backend/$t::$t failed"; failed="$failed $t"; fi
          done
          if [ -n "$failed" ]; then echo "Failed:$failed"; exit 1; fi

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Dummies. docker-compose.yml refuses to start without these (the :? form).
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      ADMIN_API_KEY: ci-dummy-admin-key
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build
      # Startup runs one full refresh (live RSS fetch, summarise, purge) before
      # uvicorn listens, so allow for slow feeds.
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null localhost:8000/api/v1/categories && exit 0
            sleep 3
          done
          echo "::error::API did not come up within 3 minutes"; exit 1
      - name: Smoke test
        run: |
          expect() {
            got=$(curl -s -o /dev/null -w '%{http_code}' "${@:2}")
            if [ "$got" = "$1" ]; then echo "ok   $got ${*:2}"; else echo "FAIL $got (want $1) ${*:2}"; return 1; fi
          }
          rc=0
          expect 200 localhost:8000/                         || rc=1
          expect 200 localhost:8000/mobile                   || rc=1
          expect 200 localhost:8000/summaries                || rc=1
          expect 200 localhost:8000/api/v1/categories        || rc=1
          expect 200 "localhost:8000/api/v1/feed?limit=5"    || rc=1
          expect 200 localhost:8000/api/v1/summaries         || rc=1
          # Admin endpoints fail closed without the key (invariant 8)...
          expect 401 localhost:8000/api/v1/telemetry/stats   || rc=1
          # ...and open with it.
          expect 200 -H "X-API-Key: $ADMIN_API_KEY" localhost:8000/api/v1/telemetry/stats || rc=1
          exit $rc
      - name: Container logs
        if: always()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down -v

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      # Gradle 8.8 / AGP 8.5 needs JDK 17-22 (CLAUDE.md).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      # The runner image ships the Android SDK and sets ANDROID_HOME, which
      # stands in for the untracked local.properties.
      # assembleRelease, not just compileReleaseKotlin: it runs R8 and resource
      # shrinking, which is where a missing keep rule breaks the build. No
      # signing secrets are set here, so it builds an unsigned APK (signing is
      # release.yml's job, #65).
      # (Offline it also needs the lintVital* tasks skipped; CI has network.)
      - run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 7
